services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-phantomframe}
      MYSQL_USER: ${MYSQL_USER:-phantomframe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -e 'SELECT 1' $$MYSQL_DATABASE >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
  phantomframe:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATA_DIR: /app/data
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      DEMO_MODE: "false"
      COOKIE_SECURE: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-phantomframe}
      MYSQL_USER: ${MYSQL_USER:-phantomframe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_PREFIX: "phantomframe:"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-oss}
      OSS_BUCKET: ${OSS_BUCKET:-flowlinght}
      OSS_REGION: ${OSS_REGION:-cn-shanghai}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-shanghai.aliyuncs.com}
      OSS_ACCELERATE_ENDPOINT: ${OSS_ACCELERATE_ENDPOINT:-https://flowlinght.oss-accelerate.aliyuncs.com}
      OSS_UPLOAD_ACCELERATE: ${OSS_UPLOAD_ACCELERATE:-true}
      OSS_READ_ACCELERATE: ${OSS_READ_ACCELERATE:-true}
      OSS_PREFIX: ${OSS_PREFIX:-canvas/uploads/}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      OSS_PUBLIC_READ: ${OSS_PUBLIC_READ:-false}
      OSS_URL_TTL: ${OSS_URL_TTL:-3600}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
    volumes:
      - phantomframe-files:/app/data
volumes:
  mysql-data:
  redis-data:
  phantomframe-files:
