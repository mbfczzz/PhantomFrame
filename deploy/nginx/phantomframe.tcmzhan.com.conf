# Install on the host as /etc/nginx/conf.d/phantomframe.tcmzhan.com.conf.
# Set certificate paths to the existing certificate for this domain.
# The host-network application container serves dist/ and /api/ on 127.0.0.1:3001.
# Nginx and TLS certificates are managed on the host, outside the app image.

server {
    listen 80;
    server_name phantomframe.tcmzhan.com;

    # Use this directory if your certificate renewal uses the webroot method.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # On nginx 1.25.1+ you may replace "http2" here with a separate "http2 on;".
    listen 443 ssl http2;
    server_name phantomframe.tcmzhan.com;

    # These files must already exist and cover the server_name above.
    ssl_certificate /etc/letsencrypt/live/phantomframe.tcmzhan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phantomframe.tcmzhan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/phantomframe.access.log;
    error_log /var/log/nginx/phantomframe.error.log warn;

    # The application limits individual reference uploads to 30 MiB.
    client_max_body_size 32m;
    client_body_timeout 120s;
    send_timeout 120s;

    # Compress JS/CSS bundles and JSON API responses (model catalog, job
    # lists). Media files are already compressed and are not listed.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 180s;
    proxy_cache off;
    proxy_intercept_errors off;

    location ^~ /api/ {
        # No URI suffix: preserve the full /api/... request path.
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
    }

    location / {
        # Go handles static files and React route fallback, including /generate.
        proxy_pass http://127.0.0.1:3001;
    }
}
