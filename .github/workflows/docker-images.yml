name: docker-images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: phantomframe_ci
          MYSQL_ROOT_PASSWORD: phantomframe-ci-mysql-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Enable Redis authentication for integration checks
        run: docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass phantomframe-ci-redis-only

      - name: Test backend against isolated MySQL and Redis
        env:
          PF_INTEGRATION: "1"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: phantomframe-ci-mysql-only
          MYSQL_DATABASE: phantomframe_ci
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_PASSWORD: phantomframe-ci-redis-only
          STORAGE_DRIVER: local
        run: go test -count=1 ./...

      - uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/phantomframe" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build runnable application image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: phantomframe:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify production image startup, frontend and login
        env:
          PHANTOMFRAME_IMAGE: phantomframe:ci
          MYSQL_DATABASE: phantomframe_ci
          MYSQL_PASSWORD: phantomframe-ci-mysql-only
          REDIS_PASSWORD: phantomframe-ci-redis-only
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ADMIN_USERNAME: smoke-admin
          ADMIN_PASSWORD: phantomframe-ci-admin-only
          STORAGE_DRIVER: local
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml config --quiet
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --pull never
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /tmp/phantomframe-health.json; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3001/api/health | jq -e '.status == "ok" and .database == "mysql" and .cache == "redis"'
          curl --fail --silent http://127.0.0.1:3001/generate | grep -q '<div id="root">'
          curl --fail --silent http://127.0.0.1:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://phantomframe.tcmzhan.com' \
            --data '{"username":"smoke-admin","password":"phantomframe-ci-admin-only"}' \
            --dump-header /tmp/phantomframe-login.headers > /tmp/phantomframe-login.json
          grep -i 'set-cookie:' /tmp/phantomframe-login.headers | grep -qi 'secure'
          docker exec phantomframe sh -c 'test -f /app/dist/index.html && command -v ffprobe && ! command -v nginx'
          docker restart phantomframe
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3001/api/health | jq -e '.status == "ok"'

      - name: Validate standalone Nginx configuration
        run: |
          mkdir -p /tmp/phantomframe-cert
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=phantomframe.tcmzhan.com \
            -keyout /tmp/phantomframe-cert/privkey.pem \
            -out /tmp/phantomframe-cert/fullchain.pem
          docker run --rm \
            --mount type=bind,source="$PWD/deploy/nginx/phantomframe.tcmzhan.com.conf",target=/etc/nginx/conf.d/default.conf,readonly \
            --mount type=bind,source=/tmp/phantomframe-cert,target=/etc/letsencrypt/live/phantomframe.tcmzhan.com,readonly \
            nginx:stable-alpine nginx -t

      - name: Show container logs on failure
        if: failure()
        run: docker logs phantomframe || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag phantomframe:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          {
            echo "Image: \`$IMAGE_NAME:latest\`"
            echo ""
            echo "Verified: backend integration tests, production startup, frontend routing, login, restart and persistent data volume."
          } >> "$GITHUB_STEP_SUMMARY"
